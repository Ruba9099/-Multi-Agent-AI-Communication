<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Agents — Collaboration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0E17;
    --panel: #10162A;
    --panel-line: #1E2740;
    --text: #E7ECFB;
    --text-dim: #7C89B3;
    --innovator: #4FD8C6;
    --innovator-dim: rgba(79, 216, 198, 0.12);
    --reviewer: #F2A65A;
    --reviewer-dim: rgba(242, 166, 90, 0.12);
    --accent-line: #263356;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height:100vh;
  }
  .mono{ font-family:'JetBrains Mono', monospace; }

  header{
    padding: 28px clamp(20px,5vw,64px) 20px;
    border-bottom: 1px solid var(--panel-line);
    display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px;
  }
  .brand{ display:flex; flex-direction:column; gap:6px; }
  .brand .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:0.18em; text-transform:uppercase;
    color: var(--text-dim);
  }
  .brand h1{ margin:0; font-size: clamp(22px,3vw,30px); font-weight:700; letter-spacing:-0.01em;}
  .brand h1 span{ color: var(--innovator); }

  .channel-status{
    display:flex; align-items:center; gap:10px;
    font-family:'JetBrains Mono', monospace; font-size:12px; color: var(--text-dim);
    border:1px solid var(--panel-line); padding:8px 14px; border-radius:999px;
  }
  .pulse-dot{ width:8px; height:8px; border-radius:50%; background:#3B4668; }
  .pulse-dot.live{ background: var(--innovator); box-shadow:0 0 0 0 rgba(79,216,198,0.6); animation: pulse 1.6s infinite; }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(79,216,198,0.55); }
    70%{ box-shadow:0 0 0 10px rgba(79,216,198,0); }
    100%{ box-shadow:0 0 0 0 rgba(79,216,198,0); }
  }

  main{
    max-width: 920px;
    margin: 0 auto;
    padding: 28px clamp(16px,4vw,32px) 80px;
  }

  .control-row{
    display:flex; gap:12px; align-items:center; flex-wrap:wrap;
    margin-bottom: 22px;
  }
  select, button{
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--panel-line);
    padding: 11px 16px;
    border-radius: 8px;
  }
  select{ min-width: 260px; cursor:pointer; }
  button{
    cursor:pointer; color: var(--bg); background: var(--innovator);
    border-color: var(--innovator); font-weight:600; letter-spacing:0.02em;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  button:hover{ transform: translateY(-1px); }
  button:disabled{ opacity:0.45; cursor:not-allowed; transform:none; }

  .topic-desc{
    font-size: 13px; color: var(--text-dim); margin: -8px 0 22px; max-width: 620px;
  }

  .legend{
    display:flex; gap:22px; margin-bottom: 20px; font-size:12px; font-family:'JetBrains Mono', monospace; color: var(--text-dim);
  }
  .legend-item{ display:flex; align-items:center; gap:8px; }
  .swatch{ width:10px; height:10px; border-radius:3px; }

  .transcript{
    display:flex; flex-direction:column; gap:16px;
    min-height: 240px;
  }
  .empty-state{
    border:1px dashed var(--panel-line); border-radius:12px; padding: 40px 24px;
    text-align:center; color: var(--text-dim); font-size:13px;
  }

  .row{ display:flex; gap:14px; align-items:flex-start; animation: rise 0.35s ease; }
  .row.reviewer{ flex-direction:row-reverse; }
  @keyframes rise{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .avatar{
    width:38px; height:38px; border-radius:9px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700;
    border:1px solid var(--panel-line);
  }
  .row.innovator .avatar{ background: var(--innovator-dim); color: var(--innovator); border-color: rgba(79,216,198,0.35); }
  .row.reviewer .avatar{ background: var(--reviewer-dim); color: var(--reviewer); border-color: rgba(242,166,90,0.35); }

  .bubble-wrap{ max-width: 72%; display:flex; flex-direction:column; gap:6px; }
  .row.reviewer .bubble-wrap{ align-items:flex-end; }

  .meta{ font-family:'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); display:flex; gap:8px; align-items:center; }
  .row.reviewer .meta{ flex-direction:row-reverse; }

  .bubble{
    background: var(--panel);
    border:1px solid var(--panel-line);
    border-radius: 14px;
    padding: 13px 16px;
    font-size: 14.5px;
    line-height: 1.55;
  }
  .row.innovator .bubble{ border-top-left-radius:4px; border-left:2px solid var(--innovator); }
  .row.reviewer .bubble{ border-top-right-radius:4px; border-right:2px solid var(--reviewer); }

  .typing{
    display:flex; gap:4px; padding: 4px 2px;
  }
  .typing span{
    width:5px; height:5px; border-radius:50%; background: var(--text-dim);
    animation: blink 1.1s infinite;
  }
  .typing span:nth-child(2){ animation-delay:0.15s; }
  .typing span:nth-child(3){ animation-delay:0.3s; }
  @keyframes blink{ 0%,80%,100%{opacity:0.25;} 40%{opacity:1;} }

  .end-banner{
    text-align:center; font-family:'JetBrains Mono', monospace; font-size:12px;
    color: var(--text-dim); padding: 18px 0 4px; letter-spacing:0.05em;
  }

  footer{
    text-align:center; padding: 20px; font-family:'JetBrains Mono', monospace;
    font-size: 11px; color: var(--text-dim); border-top:1px solid var(--panel-line);
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="eyebrow mono">ai agent collaboration · redis pub/sub · fastapi</span>
    <h1><span>AI Agents</span></h1>
  </div>
  <div class="channel-status">
    <span class="pulse-dot" id="pulseDot"></span>
    <span id="channelLabel">channel: chat:conversation — idle</span>
  </div>
</header>

<main>
  <div class="control-row">
    <select id="topicSelect"></select>
    <button id="startBtn">Start Conversation</button>
  </div>
  <div class="topic-desc" id="topicDesc"></div>

  <div class="legend">
    <div class="legend-item"><span class="swatch" style="background:var(--innovator)"></span> Innovator Agent</div>
    <div class="legend-item"><span class="swatch" style="background:var(--reviewer)"></span> Reviewer Agent</div>
  </div>

  <div class="transcript" id="transcript">
    <div class="empty-state">Koi conversation abhi shuru nahi hui. Topic chunein aur "Start Conversation" dabayein.</div>
  </div>
</main>

<footer>built with FastAPI · Redis Pub/Sub · SQLite · WebSocket</footer>

<script>
const API = "";
const transcript = document.getElementById('transcript');
const topicSelect = document.getElementById('topicSelect');
const topicDesc = document.getElementById('topicDesc');
const startBtn = document.getElementById('startBtn');
const pulseDot = document.getElementById('pulseDot');
const channelLabel = document.getElementById('channelLabel');

let topics = {};
let currentConversationId = null;
let ws = null;

async function loadTopics(){
  const res = await fetch(`${API}/api/topics`);
  const data = await res.json();
  topicSelect.innerHTML = '';
  data.forEach(t => {
    topics[t.key] = t;
    const opt = document.createElement('option');
    opt.value = t.key;
    opt.textContent = t.title;
    topicSelect.appendChild(opt);
  });
  updateDesc();
}
topicSelect.addEventListener('change', updateDesc);
function updateDesc(){
  const t = topics[topicSelect.value];
  topicDesc.textContent = t ? t.description : '';
}

function connectWS(){
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = (evt) => {
    const data = JSON.parse(evt.data);
    if (data.event === 'message' && data.conversation_id === currentConversationId){
      appendMessage(data.speaker, data.text);
    } else if (data.event === 'end' && data.conversation_id === currentConversationId){
      appendEndBanner();
      setLive(false);
    }
  };
  ws.onopen = () => { channelLabel.textContent = 'channel: chat:conversation — connected'; };
  ws.onclose = () => { channelLabel.textContent = 'channel: chat:conversation — disconnected'; setTimeout(connectWS, 1500); };
}

function setLive(isLive){
  pulseDot.classList.toggle('live', isLive);
  channelLabel.textContent = isLive
    ? 'channel: chat:conversation — streaming'
    : 'channel: chat:conversation — idle';
}

function clearTranscript(){
  transcript.innerHTML = '';
}

function appendMessage(speaker, text){
  const row = document.createElement('div');
  row.className = `row ${speaker}`;
  const initials = speaker === 'innovator' ? 'IN' : 'RV';
  row.innerHTML = `
    <div class="avatar">${initials}</div>
    <div class="bubble-wrap">
      <div class="meta">${speaker === 'innovator' ? 'Innovator Agent' : 'Reviewer Agent'}</div>
      <div class="bubble">${escapeHtml(text)}</div>
    </div>
  `;
  transcript.appendChild(row);
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function appendEndBanner(){
  const div = document.createElement('div');
  div.className = 'end-banner';
  div.textContent = '— conversation complete —';
  transcript.appendChild(div);
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  clearTranscript();
  setLive(true);
  const topicKey = topicSelect.value;
  const res = await fetch(`${API}/api/conversations/start?topic_key=${encodeURIComponent(topicKey)}`, { method: 'POST' });
  const data = await res.json();
  currentConversationId = data.conversation_id;
  startBtn.disabled = false;
});

loadTopics();
connectWS();
</script>

</body>
</html>
